<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GE Midterm Exam Schedule</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =========================================================
           Theme
           ========================================================= */
        :root {
            --background: #EDF1F6;
            --card: #FFFFFF;
            --text: #13202E;
            --muted-text: #566678;
            --border: #D3DBE5;
            --accent: #1D4ED8;
            --accent-text: #FFFFFF;
            --empty-cell: #F4F6F9;

            --subject-saturation: 72%;
            --subject-lightness: 91%;
            --subject-border-lightness: 44%;

            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --background: #0E141B;
                --card: #151D27;
                --text: #E7EDF4;
                --muted-text: #93A2B4;
                --border: #263241;
                --accent: #7DA2FF;
                --accent-text: #0E141B;
                --empty-cell: #111922;

                --subject-saturation: 38%;
                --subject-lightness: 24%;
                --subject-border-lightness: 62%;
            }
        }

        :root[data-theme="dark"] {
            --background: #0E141B;
            --card: #151D27;
            --text: #E7EDF4;
            --muted-text: #93A2B4;
            --border: #263241;
            --accent: #7DA2FF;
            --accent-text: #0E141B;
            --empty-cell: #111922;

            --subject-saturation: 38%;
            --subject-lightness: 24%;
            --subject-border-lightness: 62%;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font: 15px/1.4 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 16px 32px;
        }

        h1 {
            margin: 0;
            font: 700 clamp(26px, 4.2vw, 40px)/1.05 "Bricolage Grotesque",
                "Instrument Sans", system-ui, sans-serif;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 6px 0 18px;
            color: var(--muted-text);
        }

        /* =========================================================
           Day tabs
           ========================================================= */
        .day-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .day-tabs button {
            flex: 1 1 0;
            max-width: 270px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .day-tabs button[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-text);
        }

        .day-tabs span {
            font-size: 13px;
            opacity: 0.8;
        }

        .day-tabs i {
            margin-left: auto;
            padding: 1px 8px;
            border-radius: 999px;
            background: color-mix(in srgb, currentColor 16%, transparent);
            font-size: 12px;
            font-style: normal;
            font-weight: 600;
        }

        /* =========================================================
           Filters
           ========================================================= */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        select {
            flex: 1 1 170px;
            max-width: 260px;
            min-width: 0;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font: inherit;
        }

        .reset-button {
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: none;
            color: var(--accent);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        /* =========================================================
           Stats and subject legend
           ========================================================= */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
            margin-bottom: 10px;
            color: var(--muted-text);
            font-size: 13.5px;
        }

        .stats b {
            color: var(--text);
            font-size: 15px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .subject-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--card);
            color: var(--text);
            font: inherit;
            font-size: 12.5px;
            cursor: pointer;
        }

        .subject-chip::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 3px;
            background: hsl(var(--subject-hue) 62% var(--subject-border-lightness));
        }

        .subject-chip[aria-pressed="true"] {
            outline: 2px solid hsl(var(--subject-hue) 62% var(--subject-border-lightness));
            outline-offset: 1px;
        }

        /* =========================================================
           Schedule board
           ========================================================= */
        .schedule-board {
            overflow: auto;
            max-height: 76vh;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 104px repeat(6, minmax(184px, 1fr));
            min-width: 1210px;
        }

        .schedule-grid > * {
            border: 0;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .grid-header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            padding: 10px 12px;
            background: var(--card);
            font-weight: 600;
        }

        .grid-header small {
            color: var(--muted-text);
            font-size: 12px;
            font-weight: 400;
        }

        .corner-header {
            left: 0;
            z-index: 4;
        }

        .room-button {
            position: sticky;
            left: 0;
            z-index: 1;
            padding: 0 12px;
            background: var(--card);
            color: var(--text);
            font: inherit;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .room-button:hover {
            color: var(--accent);
        }

        .exam-card {
            min-width: 0;
            min-height: 72px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            padding: 8px 10px 8px 14px;
            background: hsl(
                var(--subject-hue)
                var(--subject-saturation)
                var(--subject-lightness)
            );
            box-shadow: inset 4px 0 0
                hsl(var(--subject-hue) 62% var(--subject-border-lightness));
        }

        .exam-card.is-dimmed {
            opacity: 0.2;
        }

        .empty-slot {
            background: var(--empty-cell);
        }

        .filter-link {
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .filter-link:hover {
            text-decoration: underline;
        }

        .exam-card .filter-link:first-child {
            font-size: 14.5px;
            font-weight: 700;
        }

        .exam-card .filter-link:nth-child(2) {
            font-size: 12.5px;
            opacity: 0.85;
        }

        .exam-card em {
            max-width: 100%;
            margin-top: auto;
            overflow: hidden;
            color: inherit;
            font-size: 11.5px;
            font-style: normal;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.75;
        }

        .empty-message {
            padding: 40px 16px;
            color: var(--muted-text);
            text-align: center;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>

        const exams = scheduleData.rows.map(
            ([
                dayIndex,
                timeSlotIndex,
                subjectIndex,
                section,
                proctor,
                room,
            ]) => ({
                dayIndex,
                timeSlotIndex,
                subjectIndex,
                section,
                proctor,
                room,
            })
        );

        /* =========================================================
           DOM helpers
           ========================================================= */
        const select = (selector) => document.querySelector(selector);

        const escapeHtml = (value) =>
            String(value).replace(
                /[&<>"]/g,
                (character) =>
                    ({
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                    })[character]
            );

        const naturalSort = (a, b) =>
            a.localeCompare(b, undefined, { numeric: true });

        const getSubjectHue = (subjectIndex) =>
            Math.round(subjectIndex * 137.508) % 360;

        const getUniqueSortedValues = (items) =>
            [...new Set(items)].sort(naturalSort);

        /* =========================================================
           Filter state
           ========================================================= */
        const filterState = {
            dayIndex: 0,
            proctor: "",
            room: "",
            section: "",
            subjectIndex: null,
        };

        const filterControls = {
            proctor: {
                selector: "#proctorFilter",
                placeholder: "All proctors",
            },
            room: {
                selector: "#roomFilter",
                placeholder: "All rooms",
            },
            section: {
                selector: "#sectionFilter",
                placeholder: "All sections",
            },
        };

        function examMatchesFilters(exam) {
            const matchesProctor =
                !filterState.proctor || exam.proctor === filterState.proctor;

            const matchesRoom =
                !filterState.room || exam.room === filterState.room;

            const matchesSection =
                !filterState.section || exam.section === filterState.section;

            return matchesProctor && matchesRoom && matchesSection;
        }

        function populateFilter(filterName) {
            const control = filterControls[filterName];
            const values = getUniqueSortedValues(
                exams.map((exam) => exam[filterName])
            );

            select(control.selector).innerHTML = [
                `<option value="">${control.placeholder}</option>`,
                ...values.map(
                    (value) =>
                        `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`
                ),
            ].join("");
        }

        function syncFilterControls() {
            Object.entries(filterControls).forEach(
                ([filterName, { selector }]) => {
                    select(selector).value = filterState[filterName];
                }
            );

            select("#resetFilters").hidden =
                !filterState.proctor &&
                !filterState.room &&
                !filterState.section &&
                filterState.subjectIndex === null;
        }

        /* =========================================================
           Rendering
           ========================================================= */
        function ensureSelectedDayHasResults(filteredExams) {
            const selectedDayHasResults = filteredExams.some(
                (exam) => exam.dayIndex === filterState.dayIndex
            );

            if (selectedDayHasResults || filteredExams.length === 0) {
                return;
            }

            const firstDayWithResults = scheduleData.days.findIndex(
                (_, dayIndex) =>
                    filteredExams.some((exam) => exam.dayIndex === dayIndex)
            );

            if (firstDayWithResults >= 0) {
                filterState.dayIndex = firstDayWithResults;
            }
        }

        function renderDayTabs(filteredExams) {
            select("#dayTabs").innerHTML = scheduleData.days
                .map((day, dayIndex) => {
                    const examCount = filteredExams.filter(
                        (exam) => exam.dayIndex === dayIndex
                    ).length;

                    return `
                        <button
                            type="button"
                            data-day-index="${dayIndex}"
                            aria-pressed="${dayIndex === filterState.dayIndex}"
                        >
                            <b>${escapeHtml(day.tab)}</b>
                            <span>${escapeHtml(day.date)}</span>
                            <i>${examCount}</i>
                        </button>
                    `;
                })
                .join("");
        }

        function renderStats(dayExams, rooms) {
            const uniqueSections = new Set(
                dayExams.map((exam) => exam.section)
            ).size;

            const uniqueProctors = new Set(
                dayExams.map((exam) => exam.proctor)
            ).size;

            const stat = (value, label) =>
                `<span><b>${value}</b> ${label}</span>`;

            select("#scheduleStats").innerHTML =
                stat(dayExams.length, "exams") +
                stat(uniqueSections, "sections") +
                stat(uniqueProctors, "proctors") +
                stat(rooms.length, "rooms");
        }

        function renderSubjectLegend(dayExams) {
            const usedSubjectIndexes = [
                ...new Set(dayExams.map((exam) => exam.subjectIndex)),
            ].sort((a, b) => a - b);

            select("#subjectLegend").innerHTML = usedSubjectIndexes
                .map((subjectIndex) => {
                    const isSelected =
                        filterState.subjectIndex === subjectIndex;

                    return `
                        <button
                            type="button"
                            class="subject-chip"
                            style="--subject-hue: ${getSubjectHue(subjectIndex)}"
                            data-subject-index="${subjectIndex}"
                            aria-pressed="${isSelected}"
                        >
                            ${escapeHtml(scheduleData.subjects[subjectIndex])}
                        </button>
                    `;
                })
                .join("");
        }

        function renderScheduleBoard(dayExams, rooms) {
            if (dayExams.length === 0) {
                select("#scheduleBoard").innerHTML =
                    '<p class="empty-message">No exams match these filters.</p>';
                return;
            }

            const examByRoomAndTime = new Map(
                dayExams.map((exam) => [
                    `${exam.room}|${exam.timeSlotIndex}`,
                    exam,
                ])
            );

            let html = `
                <div class="schedule-grid">
                    <div class="grid-header corner-header">Room</div>
            `;

            scheduleData.slots.forEach((timeSlot, timeSlotIndex) => {
                const examCount = dayExams.filter(
                    (exam) => exam.timeSlotIndex === timeSlotIndex
                ).length;

                html += `
                    <div class="grid-header">
                        ${escapeHtml(timeSlot)}
                        <small>${examCount} exams</small>
                    </div>
                `;
            });

            rooms.forEach((room) => {
                html += `
                    <button
                        type="button"
                        class="room-button"
                        data-filter-room="${escapeHtml(room)}"
                        title="Show only ${escapeHtml(room)}"
                    >
                        ${escapeHtml(room)}
                    </button>
                `;

                scheduleData.slots.forEach((_, timeSlotIndex) => {
                    const exam = examByRoomAndTime.get(
                        `${room}|${timeSlotIndex}`
                    );

                    if (!exam) {
                        html += '<div class="empty-slot"></div>';
                        return;
                    }

                    const isDimmed =
                        filterState.subjectIndex !== null &&
                        filterState.subjectIndex !== exam.subjectIndex;

                    const subjectName =
                        scheduleData.subjects[exam.subjectIndex];

                    html += `
                        <div
                            class="exam-card${isDimmed ? " is-dimmed" : ""}"
                            style="--subject-hue: ${getSubjectHue(exam.subjectIndex)}"
                            title="${escapeHtml(subjectName)}"
                        >
                            <button
                                type="button"
                                class="filter-link"
                                data-filter-section="${escapeHtml(exam.section)}"
                            >
                                ${escapeHtml(exam.section)}
                            </button>

                            <button
                                type="button"
                                class="filter-link"
                                data-filter-proctor="${escapeHtml(exam.proctor)}"
                            >
                                ${escapeHtml(exam.proctor)}
                            </button>

                            <em>${escapeHtml(subjectName)}</em>
                        </div>
                    `;
                });
            });

            html += "</div>";
            select("#scheduleBoard").innerHTML = html;
        }

        function renderSchedule() {
            const filteredExams = exams.filter(examMatchesFilters);

            ensureSelectedDayHasResults(filteredExams);
            syncFilterControls();
            renderDayTabs(filteredExams);

            const dayExams = filteredExams.filter(
                (exam) => exam.dayIndex === filterState.dayIndex
            );

            const rooms = getUniqueSortedValues(
                dayExams.map((exam) => exam.room)
            );

            renderStats(dayExams, rooms);
            renderSubjectLegend(dayExams);
            renderScheduleBoard(dayExams, rooms);
        }

        /* =========================================================
           Filter actions
           ========================================================= */
        function toggleTextFilter(filterName, value) {
            filterState[filterName] =
                filterState[filterName] === value ? "" : value;
        }

        function resetFilters() {
            filterState.proctor = "";
            filterState.room = "";
            filterState.section = "";
            filterState.subjectIndex = null;
        }

        document.addEventListener("click", (event) => {
            const button = event.target.closest("button");

            if (!button) {
                return;
            }

            const {
                dayIndex,
                subjectIndex,
                filterRoom,
                filterProctor,
                filterSection,
                action,
            } = button.dataset;

            if (dayIndex !== undefined) {
                filterState.dayIndex = Number(dayIndex);
            } else if (subjectIndex !== undefined) {
                const selectedSubjectIndex = Number(subjectIndex);

                filterState.subjectIndex =
                    filterState.subjectIndex === selectedSubjectIndex
                        ? null
                        : selectedSubjectIndex;
            } else if (filterRoom !== undefined) {
                toggleTextFilter("room", filterRoom);
            } else if (filterProctor !== undefined) {
                toggleTextFilter("proctor", filterProctor);
            } else if (filterSection !== undefined) {
                toggleTextFilter("section", filterSection);
            } else if (action === "reset-filters") {
                resetFilters();
            } else {
                return;
            }

            renderSchedule();
        });

        Object.entries(filterControls).forEach(
            ([filterName, { selector }]) => {
                select(selector).addEventListener("change", (event) => {
                    filterState[filterName] = event.target.value;
                    renderSchedule();
                });
            }
        );

        /* =========================================================
           App initialization
           ========================================================= */
        Object.keys(filterControls).forEach(populateFilter);
        renderSchedule();
    </script>
